<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 420" width="900" height="420" font-family="system-ui,-apple-system,'Segoe UI',sans-serif">
  <rect width="900" height="420" fill="#0d1117"/>
  <text x="450" y="38" fill="#e6edf3" font-size="20" font-weight="700" text-anchor="middle">守 Mamori — みんなでレポートして、みんなで守る</text>

  <!-- sources -->
  <g>
    <rect x="30" y="80" width="180" height="60" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="120" y="106" fill="#e6edf3" font-size="13" font-weight="600" text-anchor="middle">CISA KEV</text>
    <text x="120" y="124" fill="#8b949e" font-size="11" text-anchor="middle">悪用確認済み脆弱性</text>

    <rect x="30" y="160" width="180" height="60" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="120" y="186" fill="#e6edf3" font-size="13" font-weight="600" text-anchor="middle">JPCERT/CC</text>
    <text x="120" y="204" fill="#8b949e" font-size="11" text-anchor="middle">注意喚起・週報</text>

    <rect x="30" y="240" width="180" height="60" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="120" y="266" fill="#e6edf3" font-size="13" font-weight="600" text-anchor="middle">参加者の観測</text>
    <text x="120" y="284" fill="#8b949e" font-size="11" text-anchor="middle">攻撃のIoC（TLP付）</text>
  </g>

  <!-- hub -->
  <rect x="330" y="120" width="240" height="180" rx="14" fill="#161b22" stroke="#3fb950" stroke-width="2"/>
  <text x="450" y="150" fill="#3fb950" font-size="15" font-weight="700" text-anchor="middle">Mamori ハブ</text>
  <text x="450" y="176" fill="#e6edf3" font-size="12" text-anchor="middle">6時間ごとに自動収集</text>
  <text x="450" y="198" fill="#e6edf3" font-size="12" text-anchor="middle">自動匿名化（IP /24・メール除去）</text>
  <text x="450" y="220" fill="#e6edf3" font-size="12" text-anchor="middle">TLP管理（CLEAR/GREEN/AMBER）</text>
  <text x="450" y="242" fill="#e6edf3" font-size="12" text-anchor="middle">スタック照合 → 対策下書き</text>
  <text x="450" y="268" fill="#8b949e" font-size="11" text-anchor="middle">観測は90日で自動削除</text>

  <!-- outputs -->
  <g>
    <rect x="690" y="80" width="180" height="60" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="780" y="106" fill="#e6edf3" font-size="13" font-weight="600" text-anchor="middle">脅威レポート</text>
    <text x="780" y="124" fill="#8b949e" font-size="11" text-anchor="middle">要対応 / 要確認に分類</text>

    <rect x="690" y="160" width="180" height="60" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="780" y="186" fill="#e6edf3" font-size="13" font-weight="600" text-anchor="middle">Mac アプリ「守」</text>
    <text x="780" y="204" fill="#8b949e" font-size="11" text-anchor="middle">この Mac を毎日採点</text>

    <rect x="690" y="240" width="180" height="60" rx="10" fill="#161b22" stroke="#30363d"/>
    <text x="780" y="266" fill="#e6edf3" font-size="13" font-weight="600" text-anchor="middle">公開API / STIX 2.1</text>
    <text x="780" y="284" fill="#8b949e" font-size="11" text-anchor="middle">TLP:CLEAR（登録不要）</text>
  </g>

  <!-- arrows -->
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <path d="M0,0 L8,3 L0,6 Z" fill="#58a6ff"/>
    </marker>
  </defs>
  <g stroke="#58a6ff" stroke-width="1.6" fill="none" marker-end="url(#a)">
    <path d="M210,110 C270,110 280,170 330,180"/>
    <path d="M210,190 L330,205"/>
    <path d="M210,270 C270,270 280,240 330,230"/>
    <path d="M570,180 C630,170 640,110 690,110"/>
    <path d="M570,205 L690,190"/>
    <path d="M570,230 C630,240 640,270 690,270"/>
  </g>
</svg>
