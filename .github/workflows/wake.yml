name: wake
# ハブは無アクセス時に停止する。6時間ごとに起こし、情報が古ければハブ自身が取得する
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:

jobs:
  wake:
    runs-on: ubuntu-latest
    steps:
      - run: |
          curl -fsS https://mamori.teai.io/healthz
          sleep 90
          curl -fsS https://mamori.teai.io/api/refresh-status | tee status.json
          # 取得に失敗して情報が古いままならジョブを失敗にする
          python3 -c 'import json;s=json.load(open("status.json"));a=s["bundle_age_hours"];print("age",a);exit(0 if a < 7 else 1)'
