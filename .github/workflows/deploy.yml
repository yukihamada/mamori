name: deploy
on:
  push:
    branches: [main]
    paths-ignore:
      - "LICENSE"
      - "LICENSE.*"
      - ".gitignore"
      - ".claude/**"
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - run: python3 -m py_compile hub/server.py agent/*.py admin/*.py
      - run: python3 tests/test_v05.py
      - run: python3 tests/test_mamori.py
      - run: python3 tests/test_guard.py
      - run: python3 tests/test_attacks.py
      - run: python3 tests/test_install.py

  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: { python-version: "3.12" }
      - run: python tests/test_install_ps1.py

  deploy:
    needs: [test, test-windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: superfly/flyctl-actions/setup-flyctl@dfdfedc86b296f5e5384f755a18bf400409a15d0 # v1.4
      - run: flyctl deploy --remote-only -a mamori-hub
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      - name: verify
        run: |
          for i in 1 2 3 4 5 6; do
            sleep 10
            v=$(curl -fsS https://mamori.teai.io/api/stats | python3 -c 'import json,sys;print(json.load(sys.stdin).get("version"))') || true
            [ "$v" = "0.5" ] && echo "live version $v" && exit 0
          done
          echo "version check failed"; exit 1
